[tool.poetry]
name = "newsroom"
version = "0.1.0"
description = "AI Media Studio content pipeline"
authors = ["AI Media Studio"]
readme = "README.md"
packages = [{ include = "newsroom", from = "src" }]

[tool.poetry.dependencies]
python = ">=3.11,<3.14"
typer = ">=0.12"

[tool.poetry.group.dev.dependencies]
pytest = ">=8"
ruff = ">=0.5"
mypy = ">=1.10"

[tool.poetry.scripts]
newsroom = "newsroom.cli:app"

[build-system]
requires = ["poetry-core>=1.9"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 100
src = ["src", "tests"]
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
strict = true
files = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
