[project]
name = "newsroom"
version = "0.1.0"
description = "AI Media Studio content pipeline: collect, fetch (素材收集與補料)"
requires-python = ">=3.11"
dependencies = [
  "psycopg[binary]>=3.2",
  "httpx>=0.27",
  "lxml>=5",
  "readability-lxml>=0.8",
  "lxml_html_clean>=0.1",
  "typer>=0.12",
  "regex>=2024.5",
  "html5lib>=1.1",
  "beautifulsoup4>=4.12",
  "soupsieve>=2.5",
  "psycopg-pool>=3.2",
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "pillow>=10",
  "segno>=1.6",
  "croniter>=2",
  "tzdata",
  "numpy>=1.26",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.11"]
record = ["playwright>=1.45"]

[project.scripts]
newsroom = "newsroom.cli:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
newsroom = ["collect/*.json", "fetch/*.json", "core/migrations/*.sql", "engine/pack/*.json", "engine/pack/prompts/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["db: needs a throwaway PostgreSQL (DATABASE_URL ending in _test or _ci)"]

[tool.ruff]
line-length = 150
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501", "B008", "UP007", "UP045", "UP017", "RUF001", "E731"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
