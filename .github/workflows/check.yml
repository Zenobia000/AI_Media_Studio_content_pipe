# Checks on GitHub-hosted runners: install, typecheck, web build, the web and backend tests on a fresh
# PostgreSQL, the built site's smoke check on the empty database, and the Docker image brought up with docker compose.
# Only GitHub-owned actions, pinned to a full commit SHA.
# The python job runs ruff, mypy and pytest; the other two jobs are the original Node checks and the Docker bring-up.
name: Check

on:
  push:
    branches: [main, dev]
    paths: ["AIHOT/**", "src/**", "tests/**", "skills/**", "pyproject.toml", "constraints.txt", "check_setup.py", "start_dev.py", "stop_dev.py", "deploy/**", ".github/workflows/check.yml"]
  pull_request:
    paths: ["AIHOT/**", "src/**", "tests/**", "skills/**", "pyproject.toml", "constraints.txt", "check_setup.py", "start_dev.py", "stop_dev.py", "deploy/**", ".github/workflows/check.yml"]
  workflow_dispatch:

permissions:
  contents: read

# The app lives in AIHOT/ (the repo root also holds docs/, skills/ and spikes/).
defaults:
  run:
    working-directory: AIHOT

concurrency:
  group: check-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: aihot_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 2s --health-timeout 5s --health-retries 30
    env:
      DATABASE_URL: postgres://postgres:ci@127.0.0.1:5432/aihot_ci
      SITE_URL: http://127.0.0.1:3000
      API_BASE_URL: http://127.0.0.1:3001
      SESSION_SECRET: ci-session-secret-0123456789abcdef
      IMG_PROXY_SIGN_SECRET: ci-img-secret-0123456789abcdef
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install
        run: npm ci --no-audit --no-fund
      - name: Online migration safety
        # New migrations against the PR base: deployed ones unchanged, no whole-table rewrite or blocking index in a release.
        env:
          MIGRATION_BASE: ${{ github.event.pull_request.base.sha || github.sha }}
        run: node scripts/check-migrations.ts --base "$MIGRATION_BASE"
      - name: PostgreSQL backup tools
        # 恢复测试需要与 PostgreSQL 17 服务匹配的客户端，不能依赖 runner 的默认版本。
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl --fail --silent --show-error -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          . /etc/os-release
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt ${VERSION_CODENAME}-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends postgresql-client-17
          echo "/usr/lib/postgresql/17/bin" >> "$GITHUB_PATH"
          /usr/lib/postgresql/17/bin/pg_dump --version
          /usr/lib/postgresql/17/bin/pg_restore --version
      - name: Typecheck
        run: npm run typecheck
      - name: Build web
        run: npm run build -w @aihot/web
      - name: Browser test engines
        run: npx playwright install --with-deps chromium webkit
      - name: Web tests
        run: npm run test:web

      # Each test file runs on its own copy of aihot_ci (tests/databases.ts), which the run migrates and
      # leaves empty; the smoke check then reads that empty database.
      - name: Backend tests
        run: npm test
      - name: Smoke check of the built site
        # The site itself runs with collection and model calls off (the tests above use local stubs).
        env:
          COLLECT_ENABLED: "false"
          MODEL_CALLS_ENABLED: "false"
        run: |
          node apps/api/src/main.ts > "$RUNNER_TEMP/api.log" 2>&1 &
          (cd apps/web && NODE_ENV=production exec node server.ts) > "$RUNNER_TEMP/web.log" 2>&1 &
          for i in $(seq 1 60); do curl -fsS -o /dev/null http://127.0.0.1:3000/api/health 2>/dev/null && break; sleep 1; done
          node scripts/smoke.ts --base http://127.0.0.1:3000
          node scripts/mcp-check.ts http://127.0.0.1:3000/api/mcp
      - name: Server logs
        if: failure()
        run: tail -n 60 "$RUNNER_TEMP/api.log" "$RUNNER_TEMP/web.log" 2>/dev/null || true

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false
      - name: Configure a throwaway site
        run: |
          node scripts/init-env.ts --llm-key ci-not-a-real-key
          # No outside calls in CI: nothing is collected and no model is asked.
          sed -i 's/^COLLECT_ENABLED=.*/COLLECT_ENABLED=false/; s/^MODEL_CALLS_ENABLED=.*/MODEL_CALLS_ENABLED=false/' .env
          # The smoke check reaches the site by its compose service name.
          echo "MCP_ALLOWED_HOSTS=web" >> .env
      - name: Build and start with docker compose
        run: docker compose up -d --build
      - name: Smoke check
        run: |
          for i in $(seq 1 90); do curl -fsS -o /dev/null http://127.0.0.1:3000/api/health 2>/dev/null && break; sleep 2; done
          docker compose ps
          docker compose run --rm --no-deps --entrypoint node setup scripts/smoke.ts --base http://web:3000
          docker compose exec -T db psql -U mediahot -d mediahot -Atc "select count(*) from sources" | grep -qx "$(node -p "require('./industry/sources.json').sources.length")"
      - name: Logs
        if: failure()
        run: docker compose logs --tail 80
      - name: Stop
        if: always()
        run: docker compose down -v

  python:
    # The Python backend (src/newsroom): lint, then the tests on a fresh PostgreSQL. The tests build the database from AIHOT's
    # engine migrations plus ours, so no site has to be running. The comparison tests (tests/parity) ask the TypeScript API and the
    # Python one the same things on a database seeded here, which takes most of the job's time.
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: .
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: newsroom_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 2s --health-timeout 5s --health-retries 30
    env:
      DATABASE_URL: postgres://postgres:ci@127.0.0.1:5432/newsroom_ci
      PARITY_DATABASE_URL: postgres://postgres:ci@127.0.0.1:5432/parity
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The comparison tests in tests/parity run AIHOT's TypeScript (node scripts/*.ts) and need Node 24 and AIHOT's packages; without them they fail.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false
      - name: Install AIHOT packages
        working-directory: AIHOT
        run: npm ci --no-audit --no-fund
      - name: Seed the database of the comparison tests
        # Made by the TypeScript engine's own functions on its own migrations; its times are relative to now, so it is made in each run.
        # parity_tpl is the never-opened copy the tests clone their own databases from (tests/parity/conftest.py).
        working-directory: AIHOT
        env:
          DATABASE_URL: postgres://postgres:ci@127.0.0.1:5432/parity
          PGPASSWORD: ci
        run: |
          psql -h 127.0.0.1 -U postgres -v ON_ERROR_STOP=1 -c "CREATE DATABASE parity"
          node scripts/migrate.ts
          node scripts/seed-parity.ts
          psql -h 127.0.0.1 -U postgres -d parity -q -v ON_ERROR_STOP=1 -f scripts/seed-parity-bodies.sql
          psql -h 127.0.0.1 -U postgres -v ON_ERROR_STOP=1 -c "CREATE DATABASE parity_tpl TEMPLATE parity"
      - name: Install ffmpeg and the PostgreSQL 17 client
        # pg_dump for the backup test has to match the server's version (17); the runner's own client can be older.
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl --fail --silent --show-error -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          . /etc/os-release
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt ${VERSION_CODENAME}-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg postgresql-client-17
          echo "/usr/lib/postgresql/17/bin" >> "$GITHUB_PATH"
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: constraints.txt
      - name: Install
        run: python -m pip install -e ".[dev]" -c constraints.txt
      - name: Lint
        run: python -m ruff check src tests
      - name: Type check
        run: python -m mypy src
      - name: Tests
        run: python -m pytest tests -q
      - name: The tool surface starts
        run: newsroom --version && newsroom --help > /dev/null
